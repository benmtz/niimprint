[project]
name = "niimprint"
version = "0.1.0"
description = ""
authors = []

[project.dependencies]
python = ">=3.10"
pyserial = "^3.5"
pillow = "^10.1.0"
click = "^8.1.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
niimprint = "niimprint.__main__:print_cmd"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["I", "F", "E"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
